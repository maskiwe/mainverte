# Ping quotidien de l'API Supabase pour eviter la mise en pause du projet gratuit
# (inactivite > 7 jours). Independant de Netlify : double securite avec daily-reminder.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Requete REST vers Supabase
        run: |
          # Cle anon = cle publique deja presente dans index.html (aucun secret requis)
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqY2Nzb2xjdmNiaGh3aHFuZmFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTg1MjYsImV4cCI6MjEwNDc5NDUyNn0.vzd8WzVceF8Z61iC1FT8aq8PkSrAWWRJmOmYb2QjD5s" \
            "https://ejccsolcvcbhhwhqnfai.supabase.co/rest/v1/plants?select=id&limit=1"
