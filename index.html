<script>
// =====================================================
// IndexedDB Storage - runs BEFORE React/Babel
// Solves localStorage 5MB limit (photos are huge)
// IndexedDB has 50MB+ capacity
// =====================================================
const DB_NAME = 'PlantMonitorDB';
const DB_VERSION = 1;
const STORE_NAME = 'plants';

function openDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME, { keyPath: 'id' });
            }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}

async function dbLoadPlants() {
    try {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const req = store.getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => reject(req.error);
        });
    } catch (e) {
        console.error('DB load error:', e);
        // Fallback: try localStorage migration
        try {
            const raw = localStorage.getItem('plant_monitor_v2');
            if (raw) return JSON.parse(raw);
        } catch (e2) {}
        return [];
    }
}

async function dbSavePlants(plants) {
    try {
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        // Clear and re-add all (simple, reliable)
        store.clear();
        plants.forEach(p => store.put(p));
        return new Promise((resolve, reject) => {
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => reject(tx.error);
        });
    } catch (e) {
        console.error('DB save error:', e);
        return false;
    }
}

// =====================================================
// Photo compression - resize to max 800px, JPEG 60%
// A 4MB phone photo becomes ~60-100KB
// =====================================================
function compressPhoto(file, maxSize, quality) {
    maxSize = maxSize || 800;
    quality = quality || 0.6;
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let w = img.width, h = img.height;
                if (w > h) {
                    if (w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; }
                } else {
                    if (h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; }
                }
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                // Get as JPEG base64
                const dataUrl = canvas.toDataURL('image/jpeg', quality);
                const b64 = dataUrl.split(',')[1];
                resolve(b64);
            };
            img.onerror = () => reject(new Error('Erreur image'));
            img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('Erreur lecture'));
        reader.readAsDataURL(file);
    });
}

// Also keep raw base64 for API (higher quality for identification)
function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = () => reject(new Error('Erreur lecture'));
        reader.readAsDataURL(file);
    });
}

async function sbLoadPlants(userId) {
    const { data, error } = await supabaseClient.from('plants').select('id, data').eq('user_id', userId);
    if (error) throw error;
    return (data || []).map(r => r.data);
}

async function sbSavePlants(plants, userId) {
    const ids = plants.map(p => p.id);
    if (plants.length > 0) {
        const rows = plants.map(p => ({ id: p.id, user_id: userId, data: p, updated_at: new Date().toISOString() }));
        const { error } = await supabaseClient.from('plants').upsert(rows);
        if (error) throw error;
    }
    let delQuery = supabaseClient.from('plants').delete().eq('user_id', userId);
    if (ids.length > 0) delQuery = delQuery.not('id', 'in', `(${ids.join(',')})`);
    const { error: delError } = await delQuery;
    if (delError) throw delError;
    return true;
}

async function loadPlants(userId) {
    try {
        const remote = await sbLoadPlants(userId);
        dbSavePlants(remote); // rafraichit le cache local, sans attendre
        return remote;
    } catch (e) {
        console.error('Supabase load failed, fallback IndexedDB:', e);
        return dbLoadPlants();
    }
}

async function savePlants(plants, userId) {
    dbSavePlants(plants); // cache local toujours a jour immediatement
    try {
        await sbSavePlants(plants, userId);
        return true;
    } catch (e) {
        console.error('Supabase save failed:', e);
        return false;
    }
}

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ===================== SEASON =====================
function getSeason() {
    const m = new Date().getMonth();
    if (m>=3 && m<=5) return {name:'Printemps',icon:'🌸',mult:0.85,desc:'Arrosage un peu plus frequent qu\'en automne'};
    if (m>=6 && m<=8) return {name:'Ete',icon:'☀️',mult:0.7,desc:'Arrosage plus frequent (la terre seche vite)'};
    if (m>=9 && m<=10) return {name:'Automne',icon:'🍂',mult:1.0,desc:'Frequence de base'};
    return {name:'Hiver',icon:'❄️',mult:1.3,desc:'Arrosage plus espace (les plantes sont au repos)'};
}
function adjFreq(base) { return Math.max(1, Math.round(base * getSeason().mult)); }

function getActivePrescription(plant) {
    if (!plant.prescription) return null;
    if (new Date(plant.prescription.endDate) < new Date()) return null;
    return plant.prescription;
}
function getEffectiveFreq(plant) {
    const rx = getActivePrescription(plant);
    if (rx && rx.noWatering) return 999;
    if (rx && rx.wateringMultiplier !== undefined) return Math.max(1, Math.round(plant.wateringFrequency * rx.wateringMultiplier));
    return adjFreq(plant.wateringFrequency);
}
function rxDaysLeft(plant) {
    const rx = getActivePrescription(plant);
    if (!rx) return 0;
    return Math.max(0, Math.ceil((new Date(rx.endDate) - new Date()) / 86400000));
}

// ===================== JSON / GEMINI =====================
function extractJSON(text) {
    try { return JSON.parse(text); } catch {}
    let c = text.replace(/```json\s*/gi,'').replace(/```\s*/gi,'').trim();
    try { return JSON.parse(c); } catch {}
    const s=c.indexOf('{'), e=c.lastIndexOf('}');
    if (s!==-1 && e>s) {
        const b=c.substring(s,e+1);
        try { return JSON.parse(b); } catch {}
        try { return JSON.parse(b.replace(/'/g,'"').replace(/,\s*}/g,'}').replace(/,\s*]/g,']').replace(/[\n\t]/g,' ')); } catch {}
    }
    throw new Error('Reponse illisible. Reessaie.');
}
function extractAnswer(data) {
    const parts = data.candidates?.[0]?.content?.parts;
    if (!parts?.length) return null;
    for (let i=parts.length-1;i>=0;i--) { if (!parts[i].thought && parts[i].text) return parts[i].text; }
    for (let i=parts.length-1;i>=0;i--) { if (parts[i].text) return parts[i].text; }
    return null;
}

const GEMINI_ENDPOINT = '/.netlify/functions/gemini';

async function callGemini(base64, mimeType, prompt) {
    const body = {
        contents:[{parts:[{text:prompt},{inline_data:{mime_type:mimeType,data:base64}}]}],
        generationConfig:{temperature:0.2,maxOutputTokens:1200,responseMimeType:'application/json',thinkingConfig:{thinkingBudget:0}}
    };
    let resp = await fetch(GEMINI_ENDPOINT, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if (resp.status===400) {
        const eb = await resp.json().catch(()=>({}));
        if (JSON.stringify(eb).includes('thinking')) {
            delete body.generationConfig.thinkingConfig;
            resp = await fetch(GEMINI_ENDPOINT, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        } else throw new Error(eb.error?.message||'Erreur API');
    }
    if (!resp.ok) {
        const err = await resp.json().catch(()=>({}));
        throw new Error(err.error?.message||`Erreur ${resp.status}`);
    }
    const data = await resp.json();
    const text = extractAnswer(data);
    if (!text) throw new Error('Reponse vide.');
    return extractJSON(text);
}

// ===================== PROMPTS =====================
const IDENTIFY_PROMPT = `Tu es un expert botaniste et pedagogue. Identifie cette plante d'interieur.
Renvoie UNIQUEMENT un JSON valide :
{"name":"nom commun francais","commonNames":"noms populaires alternatifs","scientificName":"nom latin","wateringFrequency":7,"light":"faible","difficulty":"facile","tips":"Conseil 1. Conseil 2. Conseil 3.","winterFrequency":10,"summerFrequency":5,"waterAmount":"150-200ml (environ un verre)","waterTips":"Arroser quand le dessus du terreau est sec sur 2cm.","potSize":"petit"}

Regles :
- name : le nom commun le plus courant en francais (ex: "Monstera", "Ficus elastica", "Pothos")
- commonNames : autres noms populaires, surnoms ou noms vernaculaires (ex: "Plante gruyere, Faux philodendron")
- scientificName : nom latin complet avec variete si possible
- wateringFrequency : jours entre arrosages (printemps/automne, base)
- winterFrequency : jours en hiver (plus espace car repos)
- summerFrequency : jours en ete (plus frequent car evaporation)
- waterAmount : quantite d'eau en ml avec equivalent pratique (ex: "150ml (un verre)", "300ml (un petit arrosoir)")
- waterTips : conseil CONCRET pour savoir quand arroser, en francais simple
- potSize : "petit" (moins de 15cm), "moyen" (15-25cm), ou "grand" (plus de 25cm)
- light : faible, moyen ou eleve
- difficulty : facile, moyen ou difficile
- tips : 3 conseils pratiques en francais separes par des points
- UNIQUEMENT le JSON`;

function makeReIdentifyPrompt(name, scientificName) {
    return `Tu es un expert botaniste. On a precedemment identifie cette plante comme "${name}" (${scientificName}).
Regarde attentivement cette photo. Es-tu confiant dans cette identification ?
Renvoie UNIQUEMENT un JSON valide :
{"confident":true,"confirmation":"Oui c'est bien un ${name}","suggestions":[{"name":"nom commun","commonNames":"autres noms","scientificName":"nom latin","confidence":90,"reason":"explication courte"}]}

Regles :
- confident : true si l'identification actuelle est correcte, false si tu penses que c'est autre chose
- confirmation : si confident=true, une phrase confirmant l'identification
- suggestions : liste de 1 a 3 identifications possibles par ordre de probabilite
- La premiere suggestion DOIT etre celle que tu penses la plus probable
- confidence : pourcentage de confiance (0-100)
- reason : pourquoi tu penses que c'est cette plante (traits visibles)
- Inclure l'identification actuelle dans les suggestions si tu penses qu'elle reste possible
- UNIQUEMENT le JSON`;
}

function makeChatPrompt(plants) {
    const ctx = plants.map(p => {
        const rx = p.prescription ? ` [EN SOIN: ${p.prescription.instruction}]` : '';
        return `- ${p.name} (${p.scientificName}), arrosage tous les ${p.wateringFrequency}j, lumiere: ${p.light}${rx}`;
    }).join('\n');
    return `Tu es un assistant jardinier expert, pedagogue et sympathique. Tu reponds en francais, de maniere claire et accessible aux debutants.

Voici les plantes de l'utilisateur :
${ctx || '(aucune plante enregistree)'}

Reponds de maniere concise et utile. Si la question concerne une plante specifique de la liste, personnalise ta reponse. N'hesite pas a donner des conseils pratiques concrets.`;
}

const DOCTOR_PROMPT = `Tu es un docteur des plantes, pedagogue et bienveillant. Diagnostique le probleme visible.
Renvoie UNIQUEMENT un JSON valide :
{"diagnosis":"description du probleme","severity":"leger","causes":"Cause 1. Cause 2.","treatment":"Action 1. Action 2. Action 3.","urgency":"Agir rapidement","prescription":{"type":"reduire_arrosage","wateringMultiplier":1.5,"durationDays":14,"instruction":"Espacer les arrosages pendant 2 semaines"}}

Regles pour prescription :
- type : un parmi "reduire_arrosage", "augmenter_arrosage", "stop_arrosage", "brumiser", "aucune"
- wateringMultiplier : multiplicateur (1.5 = arroser 50% moins souvent, 0.7 = 30% plus souvent)
- durationDays : duree en jours
- instruction : instruction claire, concrete, en francais simple
- treatment : actions concretes accessibles a un debutant en francais simple
- severity : leger, modere ou grave
- UNIQUEMENT le JSON`;

function App() {
    const [session, setSession] = useState(undefined);

    const [dbReady, setDbReady] = useState(false);
    const [view, setView] = useState('list');

    const [loading, setLoading] = useState(false);

    const [notif, setNotif] = useState(null);
    const [doctorResult, setDoctorResult] = useState(null);
    const [doctorForId, setDoctorForId] = useState(null);
    const [reIdResult, setReIdResult] = useState(null);
    const [chatMessages, setChatMessages] = useState([]);
    const [chatInput, setChatInput] = useState('');
    const [chatLoading, setChatLoading] = useState(false);
    const fileRef = useRef(null);
    const modeRef = useRef('identify');
    const saveTimer = useRef(null);
    const chatEndRef = useRef(null);
    const season = getSeason();

    // Auth: recupere la session et ecoute les changements (connexion/deconnexion)
    useEffect(() => {
        supabaseClient.auth.getSession().then(({data}) => setSession(data.session));
        const { data: listener } = supabaseClient.auth.onAuthStateChange((_event, s) => {
            setSession(s);
            if (!s) { setPlants([]); setDbReady(false); }
        });
        return () => listener.subscription.unsubscribe();
    }, []);

    // Load plants (Supabase, fallback IndexedDB) une fois connecte
    useEffect(() => {
        if (!session) return;
        window.PlantDB.load(session.user.id).then(data => {
            setPlants(data);
            setDbReady(true);
        }).catch(() => setDbReady(true));
    }, [session]);

    // Debounced save (Supabase + cache IndexedDB) when plants change
    useEffect(() => {
        if (!dbReady || !session) return;
        if (saveTimer.current) clearTimeout(saveTimer.current);
        saveTimer.current = setTimeout(() => {
            window.PlantDB.save(plants, session.user.id).then(ok => {
                if (!ok) console.error('Save failed');
            });
        }, 300);
    }, [plants, dbReady, session]);

    // Clean expired prescriptions
    useEffect(() => {
        const has = plants.some(p => p.prescription && new Date(p.prescription.endDate) < new Date());
        if (has) setPlants(prev => prev.map(p => {
            if (p.prescription && new Date(p.prescription.endDate) < new Date()) { const {prescription,...r}=p; return r; }
            return p;
        }));
    }, [view]);

    useEffect(() => { if ('Notification' in window && Notification.permission==='default') Notification.requestPermission(); }, []);

    function showNotif(msg,type='success') { setNotif({message:msg,type}); setTimeout(()=>setNotif(null),3500); }
    function openInput(mode,pid) { modeRef.current=mode; setDoctorForId(pid||null); fileRef.current?.click(); }
    function getDays(nw) { const t=new Date();t.setHours(0,0,0,0); return Math.ceil((new Date(nw+'T00:00:00')-t)/86400000); }

    async function handleFile(e) {
        const f=e.target.files[0]; if(!f) return; e.target.value='';
        if (modeRef.current==='doctor') return handleDoctor(f);
        return handleIdentify(f);
    }

    async function handleIdentify(file) {
        setLoading(true); setLoadMsg('Identification en cours...');
        try {
            // Full quality for API identification
            const apiB64 = await window.PhotoUtils.toBase64(file);
            // Compressed for storage (~80KB instead of ~4MB)
            const storeB64 = await window.PhotoUtils.compress(file, 800, 0.6);

            const info = await callGemini(apiB64, file.type||'image/jpeg', IDENTIFY_PROMPT);
            if (!info.name) throw new Error('Plante non reconnue.');
            const base = Math.max(1,Math.round(Number(info.wateringFrequency)||7));
            const af = adjFreq(base);
            const next = new Date(); next.setDate(next.getDate()+af);
            const np = {
                id:Date.now(), name:info.name, scientificName:info.scientificName||'',
                wateringFrequency:base,
                winterFrequency:Math.max(1,Math.round(Number(info.winterFrequency)||Math.round(base*1.3))),
                summerFrequency:Math.max(1,Math.round(Number(info.summerFrequency)||Math.round(base*0.7))),
                light:info.light||'moyen', difficulty:info.difficulty||'moyen', tips:info.tips||'', commonNames:info.commonNames||'',
                waterAmount:info.waterAmount||'', waterTips:info.waterTips||'', potSize:info.potSize||'moyen',
                photo:storeB64, photoType:'image/jpeg',
                addedDate:new Date().toISOString(),
                nextWatering:next.toISOString().split('T')[0],
                wateringHistory:[new Date().toISOString()]
            };
            setPlants(prev=>[...prev,np]); showNotif(`${info.name} ajoutee ! 🌱`);
            setSelPlant(np); setView('detail');
        } catch(err) { showNotif(err.message,'error'); setView('list'); }
        finally { setLoading(false); }
    }

    async function handleDoctor(file) {
        setLoading(true); setLoadMsg('Diagnostic en cours...');
        try {
            const apiB64 = await window.PhotoUtils.toBase64(file);
            const storeB64 = await window.PhotoUtils.compress(file, 600, 0.5);
            const r = await callGemini(apiB64, file.type||'image/jpeg', DOCTOR_PROMPT);

            r.photo = storeB64; r.photoType = 'image/jpeg';

        } catch(err) { showNotif(err.message,'error'); }
        finally { setLoading(false); }

    function applyPrescription(plantId, prescription) {
        if (!prescription || prescription.type==='aucune') { showNotif('Pas de modif necessaire.'); return; }
        const end = new Date(); end.setDate(end.getDate()+(prescription.durationDays||14));
        const rx = {
            type:prescription.type, wateringMultiplier:prescription.wateringMultiplier||1.0,
            noWatering:prescription.type==='stop_arrosage',
            durationDays:prescription.durationDays||14, instruction:prescription.instruction||'',
            diagnosis:doctorResult?.diagnosis||'', startDate:new Date().toISOString(), endDate:end.toISOString()
        };
        const plant = plants.find(p=>p.id===plantId);
        if (!plant) return;
        let nw;
        if (rx.noWatering) { nw = end.toISOString().split('T')[0]; }
        else { const f=Math.max(1,Math.round(plant.wateringFrequency*rx.wateringMultiplier)); const n=new Date();n.setDate(n.getDate()+f); nw=n.toISOString().split('T')[0]; }
        setPlants(prev=>prev.map(p=>p.id!==plantId?p:{...p,prescription:rx,nextWatering:nw}));
        setSelPlant(prev=>(!prev||prev.id!==plantId)?prev:{...prev,prescription:rx,nextWatering:nw});
        showNotif('Prescription appliquee ! 🩺'); setView('detail');

    async function callGeminiText(systemPrompt, userMessage) {
        const body = {
            contents:[{parts:[{text: systemPrompt + '\n\nQuestion: ' + userMessage}]}],
            generationConfig:{temperature:0.7,maxOutputTokens:800,thinkingConfig:{thinkingBudget:0}}
        };
        let resp = await fetch(GEMINI_ENDPOINT, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        if (resp.status===400) {
            delete body.generationConfig.thinkingConfig;
            resp = await fetch(GEMINI_ENDPOINT, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        }
        if (!resp.ok) throw new Error('Erreur API');
        const data = await resp.json();
        return extractAnswer(data) || 'Pas de reponse.';
    }

    // ===================== SETTINGS VIEW =====================
    const SettingsView = () => {
        const [np,setNp]=useState('Notification' in window?Notification.permission:'unsupported');
        const [diag,setDiag]=useState(null);
        const [webhookUrl,setWebhookUrl]=useState(localStorage.getItem('webhook_url')||'');
        const [webhookTest,setWebhookTest]=useState(null);
        const withRx=plants.filter(p=>getActivePrescription(p));

        // Full notification diagnostic
        async function runDiagnostic() {
            const d = {};
            d.browser = navigator.userAgent.includes('Chrome') ? 'Chrome' : navigator.userAgent.includes('Firefox') ? 'Firefox' : 'Autre';
            d.notifApi = 'Notification' in window ? '✅' : '❌ Non supporte';
            d.permission = 'Notification' in window ? Notification.permission : 'N/A';
            d.swApi = 'serviceWorker' in navigator ? '✅' : '❌ Non supporte';
            d.swRegistered = '...';
            d.periodicSync = '...';
            d.isInstalled = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone ? '✅ Installee' : '❌ Non installee (ouverte dans navigateur)';

            try {
                const reg = await navigator.serviceWorker.getRegistration();
                if (reg) {
                    d.swRegistered = '✅ Actif (scope: ' + reg.scope + ')';
                    d.swState = reg.active ? '✅ active' : reg.waiting ? '⏳ waiting' : reg.installing ? '⏳ installing' : '❌ aucun';
                    if ('periodicSync' in reg) {
                        const tags = await reg.periodicSync.getTags();
                        d.periodicSync = tags.includes('check-watering') ? '✅ Enregistre' : '❌ Non enregistre';
                        d.periodicSyncApi = '✅ Supporte';
                    } else {
                        d.periodicSync = '❌ Non supporte par ce navigateur';
                        d.periodicSyncApi = '❌';
                    }
                } else {
                    d.swRegistered = '❌ Non enregistre';
                    d.periodicSync = '❌ (pas de SW)';
                }
            } catch(e) { d.swRegistered = '❌ Erreur: '+e.message; }

            try {
                const permPs = await navigator.permissions.query({name:'periodic-background-sync'});
                d.periodicSyncPerm = permPs.state;
            } catch(e) { d.periodicSyncPerm = 'N/A (non supporte)'; }

            d.indexedDB = window.indexedDB ? '✅' : '❌';
            setDiag(d);
        }

        // Test push notification
        async function testNotification() {
            if (!('Notification' in window)) { showNotif('Notifications non supportees','error'); return; }
            if (Notification.permission !== 'granted') {
                const p = await Notification.requestPermission();
                setNp(p);
                if (p !== 'granted') { showNotif('Permission refusee','error'); return; }
            }
            try {
                const reg = await navigator.serviceWorker.getRegistration();
                if (reg) {
                    await reg.showNotification('🌱 Test Main Verte', {
                        body: 'Si tu vois ceci, les notifications fonctionnent !',
                        icon: '/icon-192.png', badge: '/icon-192.png', tag: 'test-notif'
                    });
                    showNotif('Notification envoyee via SW !');
                } else {
                    new Notification('🌱 Test Main Verte', {
                        body: 'Notification basique OK. SW non actif.',
                        icon: '/icon-192.png'
                    });
                    showNotif('Notification basique OK (pas de SW)');
                }
            } catch(e) { showNotif('Erreur: '+e.message,'error'); }
        }

        // Test webhook
        async function testWebhook() {
            const url = webhookUrl.trim();
            if (!url) { showNotif('Ajoute une URL de webhook','error'); return; }
            setWebhookTest('loading');
            try {
                const today = new Date();
                const need = plants.filter(p => {
                    if (p.prescription && new Date(p.prescription.endDate)>new Date() && p.prescription.noWatering) return false;
                    return new Date(p.nextWatering+'T00:00:00') <= today;
                });
                const payload = {
                    type: 'test',
                    app: 'Main Verte',
                    date: today.toISOString(),
                    total_plants: plants.length,
                    plants_to_water: need.length,
                    plants: need.map(p => ({name:p.name,days_overdue:getDays(p.nextWatering)*-1,water_amount:p.waterAmount||''})),
                    all_plants: plants.map(p => ({name:p.name,next_watering:p.nextWatering,water_amount:p.waterAmount||''}))
                };
                const resp = await fetch(url, {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body:JSON.stringify(payload)
                });
                if (resp.ok || resp.type === 'opaque') {
                    setWebhookTest('ok');
                    showNotif('Webhook envoye ! Verifie Slack/Make');
                } else {
                    setWebhookTest('error');
                    showNotif(`Webhook erreur ${resp.status}`,'error');
                }
            } catch(e) {
                setWebhookTest('error');
                showNotif('Erreur: '+e.message,'error');
            }
        }

        return (

                    <div className="p-3 bg-gray-50 rounded-xl mb-3">
                        <div className="flex justify-between text-sm mb-1">
                            <span className="text-gray-600">Permission :</span>
                            <span className="font-bold">{np==='granted'?'✅ Activees':np==='denied'?'🚫 Bloquees':'⏸️ Non configurees'}</span>
                        </div>
                        <div className="flex justify-between text-sm">
                            <span className="text-gray-600">PWA installee :</span>
                            <span className="font-bold">{(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone)?'✅ Oui':'❌ Non'}</span>
                        </div>
                    </div>
                    {np!=='granted'&&np!=='unsupported'&&(
                        <button onClick={async()=>{const p=await Notification.requestPermission();setNp(p);if(p==='granted')showNotif('Activees !');}} className="w-full bg-blue-500 text-white py-3 rounded-xl font-semibold mb-2">🔔 Activer les notifications</button>
                    )}
                    <div className="flex gap-2">

                    </div>

                    {diag && (

                            <div className="font-bold text-gray-800 mb-2 font-sans text-sm">Diagnostic complet :</div>
                            <div>Navigateur : {diag.browser}</div>
                            <div>API Notification : {diag.notifApi}</div>
                            <div>Permission : {diag.permission}</div>

                            <div>SW state : {diag.swState || 'N/A'}</div>

                            <div>Periodic Sync API : {diag.periodicSyncApi || 'N/A'}</div>
                            <div>Periodic Sync enregistre : {diag.periodicSync}</div>
                            <div>Periodic Sync permission : {diag.periodicSyncPerm || 'N/A'}</div>
                            <div>IndexedDB : {diag.indexedDB}</div>
                            <div className="pt-2 font-sans text-gray-500">
                                {diag.permission!=='granted' && <p>→ Active les notifications d'abord</p>}

                    <input type="url" value={webhookUrl} onChange={e=>setWebhookUrl(e.target.value)}

                        className="w-full bg-purple-500 text-white py-3 rounded-xl font-semibold mb-2">💾 Sauvegarder le webhook</button>

                    {webhookUrl && (

                            {webhookTest==='loading'?'Envoi...':webhookTest==='ok'?'✅ Envoye !':webhookTest==='error'?'❌ Erreur, verifie l\'URL':'🧪 Tester le webhook'}

                    )}

                    {webhookUrl && <button onClick={async()=>{if(confirm('Supprimer ?')){localStorage.removeItem('webhook_url');try{const c=await caches.open('webhook-config');await c.delete('/webhook-url');}catch(e){}setWebhookUrl('');showNotif('Supprime');}}} className="w-full bg-red-100 text-red-600 py-2 rounded-xl font-semibold text-sm">Supprimer</button>}

                <div className="bg-white rounded-2xl shadow-lg p-6 mb-4">
                    <h3 className="font-bold text-gray-800 mb-2">{season.icon} Saison : {season.name}</h3>
                    <p className="text-sm text-gray-600">{season.desc}</p>
                </div>
                <div className="bg-white rounded-2xl shadow-lg p-6"><p className="text-sm text-gray-600">🌱 Main Verte v1.7 · Gemini 3.8 Flash · {plants.length} plante{plants.length!==1?'s':''}</p></div>
            </div>
        );
    };

    // ===================== RENDER =====================
    return (
        <div className="max-w-2xl mx-auto p-4 pb-24">
            <input ref={fileRef} type="file" accept="image/*" capture="environment" onChange={handleFile} className="hidden" />
            {notif&&<div className={`fixed top-4 left-4 right-4 z-50 p-4 rounded-xl shadow-lg fade-in text-center font-semibold ${notif.type==='error'?'bg-red-500':'bg-emerald-500'} text-white`}>{notif.message}</div>}
            {loading&&<div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50"><div className="bg-white rounded-2xl p-8 text-center mx-4"><div className="text-6xl mb-4 animate-bounce">{loadMsg.includes('Diagnostic')?'🩺':'🌱'}</div><div className="text-lg font-bold text-gray-800">{loadMsg}</div><div className="text-sm text-gray-500 mt-2">Gemini analyse...</div></div></div>}
            <div className="text-center mb-6 mt-4"><h1 className="text-3xl font-bold text-emerald-800">🌿 Main Verte</h1><p className="text-emerald-600 text-sm">Prends soin de tes plantes</p></div>
            {view==='list'&&<ListView />}
            {view==='detail'&&<DetailView />}
            {view==='calendar'&&<CalendarView />}
            {view==='settings'&&<SettingsView />}
            {view==='doctor-result'&&<DoctorResultView />}
            {view==='reidentify'&&<ReIdentifyView />}
            {view==='chat'&&(
                <div className="fade-in flex flex-col" style={{height:'calc(100vh - 240px)'}}>
                    <div className="bg-white/80 backdrop-blur-sm rounded-2xl shadow-lg p-4 mb-4">
                        <h2 className="text-2xl font-bold text-emerald-800">💬 Assistant jardin</h2>
                        <p className="text-emerald-600 text-sm">Pose tes questions sur tes plantes</p>
                    </div>
                    <div className="flex-1 overflow-y-auto space-y-3 mb-4 px-1">
                        {chatMessages.length===0 && (
                            <div className="text-center py-8">
                                <div className="text-5xl mb-4">🌿</div>
                                <p className="text-gray-500 mb-4 text-sm">Pose une question sur tes plantes !</p>
                                <div className="space-y-2">
                                    {chatQuickQ.map((q,i) => (
                                        <button key={i} onClick={()=>setChatInput(q)} className="w-full bg-white rounded-xl p-3 text-sm text-left text-gray-700 shadow-sm border border-gray-100">💬 {q}</button>
                                    ))}
                                </div>
                            </div>
                        )}
                        {chatMessages.map((m,i) => (
                            <div key={i} className={`flex ${m.role==='user'?'justify-end':'justify-start'}`}>
                                <div className={`max-w-[85%] rounded-2xl px-4 py-3 text-sm ${m.role==='user'?'bg-emerald-500 text-white rounded-br-sm':'bg-white shadow-md text-gray-800 rounded-bl-sm'}`}>
                                    <div style={{whiteSpace:'pre-wrap'}}>{m.text}</div>
                                </div>
                            </div>
                        ))}
                        {chatLoading && (
                            <div className="flex justify-start">
                                <div className="bg-white shadow-md rounded-2xl rounded-bl-sm px-4 py-3">
                                    <div className="flex gap-1"><span className="animate-bounce">.</span><span className="animate-bounce" style={{animationDelay:'0.1s'}}>.</span><span className="animate-bounce" style={{animationDelay:'0.2s'}}>.</span></div>
                                </div>
                            </div>
                        )}
                        <div ref={chatEndRef} />
                    </div>
                    <div className="flex gap-2 mt-auto">
                        <input value={chatInput} onChange={e=>setChatInput(e.target.value)}
                            onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}}}
                            placeholder="Pose ta question..." className="flex-1 px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-emerald-500 focus:outline-none text-sm" />
                        <button onClick={sendChat} disabled={chatLoading||!chatInput.trim()}
                            className={`px-4 py-3 rounded-xl font-semibold ${chatInput.trim()&&!chatLoading?'bg-emerald-500 text-white':'bg-gray-200 text-gray-400'}`}>
                            ➤
                        </button>
                    </div>
                </div>
            )}
            <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg">
                <div className="max-w-2xl mx-auto grid grid-cols-5 gap-1 p-3">
                    <button onClick={()=>{setView('list');setSelPlant(null);}} className={`flex flex-col items-center gap-1 py-2 rounded-lg ${['list','detail','doctor-result','reidentify'].includes(view)?'bg-emerald-100 text-emerald-700':'text-gray-600'}`}><span className="text-xl">🏠</span><span className="text-xs font-semibold">Plantes</span></button>
                    <button onClick={()=>setView('calendar')} className={`flex flex-col items-center gap-1 py-2 rounded-lg ${view==='calendar'?'bg-emerald-100 text-emerald-700':'text-gray-600'}`}><span className="text-xl">📅</span><span className="text-xs font-semibold">Planning</span></button>
                    <button onClick={()=>openInput('identify')} className="flex flex-col items-center gap-1 bg-emerald-500 text-white py-2 rounded-lg shadow-lg -mt-4"><span className="text-2xl">📸</span><span className="text-xs font-semibold">Ajouter</span></button>
                    <button onClick={()=>setView('chat')} className={`flex flex-col items-center gap-1 py-2 rounded-lg ${view==='chat'?'bg-emerald-100 text-emerald-700':'text-gray-600'}`}><span className="text-xl">💬</span><span className="text-xs font-semibold">Chat</span></button>
                    <button onClick={()=>setView('settings')} className={`flex flex-col items-center gap-1 py-2 rounded-lg ${view==='settings'?'bg-emerald-100 text-emerald-700':'text-gray-600'}`}><span className="text-xl">⚙️</span><span className="text-xs font-semibold">Reglages</span></button>
                </div>
            </div>
        </div>
    );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
// Service Worker + Periodic Background Sync registration
if ('serviceWorker' in navigator) {
    window.addEventListener('load', async () => {
        try {
            const reg = await navigator.serviceWorker.register('/sw.js');
            console.log('SW registered:', reg.scope);

            // Register Periodic Background Sync (~daily watering check)
            if ('periodicSync' in reg) {
                const status = await navigator.permissions.query({ name: 'periodic-background-sync' });
                if (status.state === 'granted') {
                    try {
                        await reg.periodicSync.register('check-watering', {
                            minInterval: 12 * 60 * 60 * 1000 // 12 hours minimum
                        });
                        console.log('Periodic sync registered');
                    } catch (e) {
                        console.log('Periodic sync failed:', e);
                    }
                }
            }

            // Fallback: also check on app open via regular sync
            if ('sync' in reg) {
                try { await reg.sync.register('check-watering-sync'); } catch (e) {}
            }
        } catch (e) {
            console.log('SW error:', e);
        }
    });
}

// Fallback notification on app open (works always)
// Also sends webhook if configured
window.addEventListener('load', () => {
    // Sync webhook URL from localStorage to Cache API (for SW access)
    (async () => {
        try {
            const url = localStorage.getItem('webhook_url');
            if (url) {
                const c = await caches.open('webhook-config');
                await c.put('/webhook-url', new Response(url));
            }
        } catch(e) {}
    })();

    setTimeout(async () => {
        try {
            // Read from IndexedDB
            const req = indexedDB.open('PlantMonitorDB', 1);
            req.onsuccess = async () => {
                const db = req.result;
                if (!db.objectStoreNames.contains('plants')) return;
                const tx = db.transaction('plants', 'readonly');
                const store = tx.objectStore('plants');
                const getAll = store.getAll();
                getAll.onsuccess = async () => {
                    const plants = getAll.result || [];
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);
                    const need = plants.filter(p => {
                        if (p.prescription && new Date(p.prescription.endDate) > new Date() && p.prescription.noWatering) return false;
                        return new Date(p.nextWatering + 'T00:00:00') <= today;
                    });
                    if (need.length === 0) return;

                    const title = need.length === 1
                        ? '💧 ' + need[0].name + ' a soif !'
                        : '💧 ' + need.length + ' plantes a arroser';
                    const body = need.map(p => p.name).join(', ');

                    // Push notification (if permission granted)
                    if ('Notification' in window && Notification.permission === 'granted') {
                        try { new Notification(title, { body, icon: '/icon-192.png', tag: 'open-reminder' }); } catch(e) {}
                    }

                    // Webhook (on every app open if plants need watering)
                    const webhookUrl = localStorage.getItem('webhook_url');
                    if (webhookUrl) {
                        try {
                            await fetch(webhookUrl, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    type: 'reminder',
                                    app: 'Main Verte',
                                    date: new Date().toISOString(),
                                    total_plants: plants.length,
                                    plants_to_water: need.length,
                                    message: title + ' — ' + body,
                                    plants: need.map(p => ({ name: p.name, next_watering: p.nextWatering, water_amount: p.waterAmount || '' }))
                                }),
                                mode: 'no-cors'
                            });
                        } catch(e) {}
                    }
                };
            };
        } catch (e) {}
    }, 2000);
});
</script>
</body>
